# Flux OCI HelmRepository that hosts the exalsius workspace-hub charts
# (llm-d-infra, llm-d-model). Must be applied BEFORE the ServiceTemplates that
# reference it. Applied in phase 2 (prepare).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: exalsius-workspace-hub
  namespace: kcm-system
  labels:
    # k0rdent's Flux source-controller runs with
    # --watch-label-selector=k0rdent.mirantis.com/managed=true, so without this
    # label the HelmRepository is ignored and ServiceTemplates referencing it
    # never become valid ("HelmRepository ... not found").
    k0rdent.mirantis.com/managed: "true"
spec:
  type: oci
  interval: 5m
  url: oci://ghcr.io/exalsius/exalsius-workspace-hub/charts
