# Cluster-scoped WorkspaceClass for llm-d model inference (workspace-hub 1.0.0,
# llm-d 0.9.0). Mirrors the hub's rendered manifests/llm-d-model/1.0.0/
# workspaceclass.yaml. Requires the exalsius-workspace-hub HelmRepository + the
# llm-d-infra/llm-d-model ServiceTemplates to exist first. Applied in phase 2.
#
# The chart owns the vLLM workload (a LeaderWorkerSet) and reads the operator's
# `_exalsius.resources` directly, so there is NO resourceInjection and NO EPP
# defaultValues override any more (both were 0.3.0 artefacts). Topology is one
# Helm value, modelServer.nodesPerReplica:
#   TP           = modelServer.nodesPerReplica × perReplica.gpuCount
#   model copies = replicas / modelServer.nodesPerReplica
apiVersion: workspaces.exalsius.ai/v1
kind: WorkspaceClass
metadata:
  name: llm-d-model-1-0-0
  labels:
    workspaces.exalsius.ai/template: llm-d-model
    workspaces.exalsius.ai/version: "1.0.0"
spec:
  displayName: "LLM Inference (model)"
  description: >-
    Serve one LLM for inference with the llm-d stack (llm-d router + vLLM).
    Exposes a per-workspace OpenAI-compatible endpoint; auto-installs the shared
    llm-d-infra prerequisite.
  serviceTemplate:
    name: llm-d-model-1-0-0
    namespace: kcm-system
  prerequisites:
    - serviceTemplate:
        name: llm-d-infra-1-0-0
  defaultResources:
    replicas: 1
    perReplica:
      cpu: "8"
      memory: "16Gi"
      # Sizes the model cache volume (HF_HOME) — must fit the model weights.
      storage: "50Gi"
      # A model needs at least one accelerator; a deployment can raise this.
      gpuCount: 1
  accessEndpoints:
    - name: http
      protocol: HTTP
      port: 8000
      description: "LLM Inference OpenAI-compatible REST API"
    # A per-model front door to the single shared Open WebUI chat interface,
    # routed per model because Open WebUI lives in the llm-d-infra prerequisite,
    # which owns no WorkspaceClass. Port 8000 (the pods' real port), not 80.
    - name: chat
      protocol: HTTP
      port: 8000
      description: "Open WebUI chat interface (shared across all models)"
  userFacingConfig:
    - helmValuePath: huggingfaceToken
      displayName: "Hugging Face Token"
      description: "Token for pulling the model from Hugging Face (stored in a Secret)"
      type: secret
      required: true
    - helmValuePath: inferenceApiKey
      displayName: "Inference API Key"
      description: "Optional bearer token clients must present to call the model"
      type: secret
      required: false
    - helmValuePath: model.name
      displayName: "Model Name"
      description: "Hugging Face model to serve, e.g. Qwen/Qwen3-1.7B. This is also the name clients pass in the OpenAI request body."
      type: string
      required: true
    # Single-node / multi-node toggle. Divides the pod budget (replicas ×
    # perReplica stays total demand); replicas must be a whole multiple of it.
    - helmValuePath: modelServer.nodesPerReplica
      displayName: "Nodes per Model Replica"
      description: "How many pods together serve one copy of the model. 1 (default) means each pod is a whole model. Above 1 the model is sharded across that many nodes with tensor parallelism. `replicas` must be a whole multiple of this."
      type: int
      required: false
      default: 1
  # vLLM/cuda images are large and the prerequisite installs a full stack.
  deployTimeout: 30m
  prerequisiteDeployTimeout: 20m
