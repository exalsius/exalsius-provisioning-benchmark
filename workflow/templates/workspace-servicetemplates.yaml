# k0rdent ServiceTemplates for the llm-d workspace charts, sourced from the
# exalsius-workspace-hub HelmRepository. Applied AFTER the HelmRepository and
# BEFORE the WorkspaceClass that references them. Phase 2 (prepare).
#
# Mirrors the workspace-hub's rendered manifests for llm-d-infra / llm-d-model
# 1.0.0 (llm-d 0.9.0: router charts + owned LeaderWorkerSet model server).
apiVersion: k0rdent.mirantis.com/v1beta1
kind: ServiceTemplate
metadata:
  name: llm-d-infra-1-0-0
  namespace: kcm-system
  labels:
    app: llm-d-infra
    template: workspace
    workspaces.exalsius.ai/template: llm-d-infra
    workspaces.exalsius.ai/version: "1.0.0"
spec:
  helm:
    chartSpec:
      chart: llm-d-infra
      version: "1.0.0"
      interval: 10m
      sourceRef:
        kind: HelmRepository
        name: exalsius-workspace-hub
---
apiVersion: k0rdent.mirantis.com/v1beta1
kind: ServiceTemplate
metadata:
  name: llm-d-model-1-0-0
  namespace: kcm-system
  labels:
    app: llm-d-model
    template: workspace
    workspaces.exalsius.ai/template: llm-d-model
    workspaces.exalsius.ai/version: "1.0.0"
spec:
  helm:
    chartSpec:
      chart: llm-d-model
      version: "1.0.0"
      interval: 10m
      sourceRef:
        kind: HelmRepository
        name: exalsius-workspace-hub
